<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.9; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-glow1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-glow2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 300px;
    }
    .scan-beam {
      animation: scanlineAnim 4.5s linear infinite;
    }
    .card-float1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-float2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .flow-path {
      stroke-dasharray: 8 6;
      animation: flowLine 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#gridPattern)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-glow1" cx="220" cy="110" r="190" fill="url(#glowGrad1)"/>
  <circle class="orb-glow2" cx="980" cy="300" r="230" fill="url(#glowGrad2)"/>

  <!-- Scanning laser line in background -->
  <line class="scan-beam" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Decorative Dataflow Circuit / Flow Lines -->
  <g opacity="0.35">
    <path class="flow-path" d="M 50 80 Q 200 40 380 90 T 700 80 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-path" d="M 80 360 Q 300 320 550 370 T 950 340 T 1160 360" fill="none" stroke="#818cf8" stroke-width="1.8"/>
  </g>

  <!-- Side Floating Micro Cards (Background accents placed far on sides to avoid title overlap) -->
  <g class="card-float1" opacity="0.85">
    <rect x="50" y="160" width="165" height="68" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="72" cy="184" r="6" fill="#10b981" filter="url(#glow)"/>
    <text x="86" y="188" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Code Review</text>
    <text x="72" y="212" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated PR fixes</text>
  </g>

  <g class="card-float2" opacity="0.85">
    <rect x="985" y="160" width="165" height="68" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="1007" cy="184" r="6" fill="#6366f1" filter="url(#glow)"/>
    <text x="1021" y="188" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SAST &amp; AppSec</text>
    <text x="1007" y="212" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AST / Taint Analysis</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Guaranteed never obstructed) -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="-114" cy="0" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="-98" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="152" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome AI Code Review</text>
  <text x="600" y="196" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.2">&amp; Static Analysis (SAST)</text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="244" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    The Definitive Guide to Cloud SaaS Reviewers, AST Security Engines, Linters &amp; Open-Source PR Bots
  </text>

  <!-- Interactive Tag Pills Container -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: AI PR Reviewers -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="-16" width="145" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="0" r="4" fill="#38bdf8"/>
      <text x="28" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">AI PR Reviewers</text>
    </g>

    <!-- Pill 2: SAST & AppSec -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="-16" width="135" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="0" r="4" fill="#818cf8"/>
      <text x="28" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">SAST &amp; AppSec</text>
    </g>

    <!-- Pill 3: Code Quality & Linters -->
    <g transform="translate(-10, 0)">
      <rect x="0" y="-16" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="0" r="4" fill="#a855f7"/>
      <text x="28" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Fast Rust Linters</text>
    </g>

    <!-- Pill 4: Secret & Vulnerability Scanners -->
    <g transform="translate(170, 0)">
      <rect x="0" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="0" r="4" fill="#ec4899"/>
      <text x="28" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Secret &amp; IaC Scanners</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="375" x2="900" y2="375" stroke="url(#textGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
